[package]
name = "ogs-tui"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "A terminal REPL/TUI client for the Online Go Server (OGS), modelled on the official web client's layering"
license = "MIT"
repository = "https://github.com/online-go/online-go.com"

[[bin]]
name = "ogs-tui"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio-tungstenite = { version = "=0.21.0", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ratatui = "0.29"
crossterm = "0.28"
futures-util = "0.3"
base64 = "0.22"
unicode-width = "0.2"
dirs = "6"

[profile.release]
lto = "thin"
strip = true
